services:
  - type: web
    name: zorvex-hosting
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /tmp/zorvex-data
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: ADMIN_TOKEN
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: FLASK_SECRET
        generateValue: true
